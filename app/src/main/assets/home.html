<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Início</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK -->
  <script src="scripts/firebase-config.js"></script>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    // Your web app's Firebase configuration
    const firebaseConfig = window.firebaseConfig;

    // Initialize Firebase
    if (!firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.projectId) {
      throw new Error('Firebase local config missing. See README.md.');
    }

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.rtdb = getDatabase(app);

    // Expor funções do Firestore para uso global
    window.firestoreCollection = collection;
    window.firestoreQuery = query;
    window.firestoreWhere = where;
    window.firestoreGetDocs = getDocs;

    // Expor funções do Realtime Database para uso global
    window.rtdbRef = ref;
    window.rtdbGet = get;

    console.log("✅ Firebase v9 inicializado com sucesso!");
  </script>

  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <script src="scripts/utils.js"></script>
  <script src="scripts/firebase-init.js"></script>
  <script src="scripts/pedidos.js"></script>
  <script src="scripts/home_simple.js"></script>
  <script src="scripts/accessibility.js"></script>
</head>
<body>
  <!-- Filtros SVG para daltonismo -->
  <svg class="daltonism-svg-filters" xmlns="http://www.w3.org/2000/svg" version="1.1" style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <defs>
      <!-- Protanopia (cegueira ao vermelho) -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="
          0.567, 0.433, 0, 0, 0,
          0.558, 0.442, 0, 0, 0,
          0, 0.242, 0.758, 0, 0,
          0, 0, 0, 1, 0
        "/>
      </filter>

      <!-- Deuteranopia (cegueira ao verde) -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="
          0.8, 0.2, 0, 0, 0,
          0.258, 0.742, 0, 0, 0,
          0, 0.142, 0.858, 0, 0,
          0, 0, 0, 1, 0
        "/>
      </filter>

      <!-- Tritanopia (cegueira ao azul) -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="
          0.95, 0.05, 0, 0, 0,
          0, 0.433, 0.567, 0, 0,
          0, 0.475, 0.525, 0, 0,
          0, 0, 0, 1, 0
        "/>
      </filter>
    </defs>
  </svg>

  <div class="app">

    <!-- Topo: busca + sino -->
    <header class="topbar">
      <div class="search">
        <input id="searchInput" type="text" placeholder="Buscar paneleiros" />
        <button id="btnFiltro" aria-label="Filtros" onclick="abrirPesquisaCompleta()">
          <img src="./imgs/Search.png" alt="" class="searchimg">
        </button>
      </div>
    </header>

    <!-- Resultados da busca -->
    <div id="searchResults" class="search-results">
      <!-- Cards dos paneleiros aparecerão aqui -->
    </div>

    <!-- Container Serviços (para paneleiros) -->
    <section class="services-container card" id="servicesContainer" style="display: none;">
      <h3>Meus Serviços</h3>
      <div class="services-list">
        <!-- Serviços serão carregados dinamicamente -->
      </div>
      <div class="view-more-container">
        <button class="btn-view-more" onclick="window.location.href='pedidos.html'">Ver Todos os Serviços</button>
      </div>
    </section>

    <!-- Container Mapa/Calendário (para paneleiros) -->
    <section class="map-calendar-container card" id="mapCalendarContainer" style="display: none;">
      <div class="tabs">
        <button class="tab-btn active" id="tabCalendario">Calendário</button>
        <button class="tab-btn" id="tabMapa">Mapa</button>
      </div>

      <div class="tab-content">
        <!-- Conteúdo do Calendário -->
        <div id="calendarTab" class="tab-pane active">
          <div class="calendario">
            <div class="calendario-header">
              <button id="mes-anterior" class="nav-btn-calendario"><</button>
              <span id="mes-ano">Carregando...</span>
              <button id="mes-proximo" class="nav-btn-calendario">></button>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Dom</th>
                  <th>Seg</th>
                  <th>Ter</th>
                  <th>Qua</th>
                  <th>Qui</th>
                  <th>Sex</th>
                  <th>Sáb</th>
                </tr>
              </thead>
              <tbody id="dias-calendario"></tbody>
            </table>
          </div>
        </div>

        <!-- Conteúdo do Mapa -->
        <div id="mapTab" class="tab-pane">
          <div id="map"></div>
        </div>
      </div>
    </section>

    <!-- Mapa (para clientes) -->
    <section class="map-wrapper card" id="clientMapContainer">
      <div id="clientMap"></div>
    </section>

    <!-- Carrossel (para clientes) -->
    <section class="card" id="clientCarouselContainer">
      <h3>Paneleiros em sua região</h3>
      <div class="carousel-wrapper">
        <button class="carousel-arrow carousel-prev" id="prevPaneleiro" aria-label="Paneleiro anterior">
          ‹
        </button>
        <div class="paneleiros-container">
          <div class="paneleiro">
            <div class="circle"></div>
            <p>Paneleiro</p>
          </div>
        </div>
        <button class="carousel-arrow carousel-next" id="nextPaneleiro" aria-label="Próximo paneleiro">
          ›
        </button>
      </div>

      <!-- Botão Solicitar Serviço -->
      <div class="new-order-wrapper">
        <button id="btnSolicitarServico" class="btn-new-order" onclick="window.location.href='pedidos.html#abrir-modal'">Solicitar Serviço</button>
      </div>
    </section>




    <!-- Bottom Navigation -->
    <nav class="bottom-navigation">
      <a href="pedidos.html" class="nav-item" id="btnServicos">
        <img src="./imgs/pedidoicon.png" alt="Serviços" class="nav-icon">
        <span class="nav-label">Serviços</span>
      </a>
      <a href="home.html" class="nav-item active" id="btnHome">
        <img src="./imgs/mapaicon.png" alt="Home" class="nav-icon">
        <span class="nav-label">Home</span>
      </a>
      <a href="mensagens.html" class="nav-item" id="btnMensagens">
        <img src="./imgs/chaticon.png" alt="Mensagens" class="nav-icon">
        <span class="nav-label">Mensagens</span>
      </a>
      <a href="perfil.html" class="nav-item" id="btnPerfil">
        <img src="./imgs/perfilicon.png" alt="Perfil" class="nav-icon">
        <span class="nav-label">Perfil</span>
      </a>
    </nav>

<!-- Script já carregado no head -->
  </div>
</body>
</html>

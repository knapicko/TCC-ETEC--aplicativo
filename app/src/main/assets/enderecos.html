<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Endereços</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/enderecos.css" />
  <link rel="stylesheet" href="css/accessibility.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/firebase-init.js"></script>

  <script defer src="scripts/enderecos.js"></script>
  <script defer src="scripts/accessibility.js"></script>
</head>

<body>
  <!-- Filtros SVG para daltonismo -->
  <svg class="daltonism-svg-filters" xmlns="http://www.w3.org/2000/svg" version="1.1" style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <defs>
      <!-- Protanopia (cegueira ao vermelho) -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="
          0.567, 0.433, 0, 0, 0,
          0.558, 0.442, 0, 0, 0,
          0, 0.242, 0.758, 0, 0,
          0, 0, 0, 1, 0
        "/>
      </filter>

      <!-- Deuteranopia (cegueira ao verde) -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="
          0.8, 0.2, 0, 0, 0,
          0.258, 0.742, 0, 0, 0,
          0, 0.142, 0.858, 0, 0,
          0, 0, 0, 1, 0
        "/>
      </filter>

      <!-- Tritanopia (cegueira ao azul) -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="
          0.95, 0.05, 0, 0, 0,
          0, 0.433, 0.567, 0, 0,
          0, 0.475, 0.525, 0, 0,
          0, 0, 0, 1, 0
        "/>
      </filter>
    </defs>
  </svg>

<header class="header">
    <button class="back-btn" onclick="goBack()">
      <img src="./imgs/voltar_branco.png" alt="Voltar" class="back-icon">
    </button>
    <h1 class="header-title">Endereços</h1>
</header>

<!-- Container dos Endereços -->
<div class="addresses-container">
  <div class="addresses-section">
    <h3>Seus Endereços</h3>

    <!-- Lista de endereços -->
    <div id="enderecosList">
      <p class="no-addresses">Nenhum endereço cadastrado</p>
    </div>

    <!-- Botão para adicionar novo endereço -->
    <button class="add-btn" onclick="addNewEndereco()">+ Adicionar Endereço</button>

    <!-- Modal para adicionar/editar endereço (IGUAL ao confirma_local) -->
    <div id="enderecoModal" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        box-sizing: border-box;
        display: none;
    ">
        <div style="
            width: 100%;
            height: 100%;
            border-radius: 0;
            background: white;
            display: flex;
            flex-direction: column;
            animation: modalFadeIn 0.3s ease-out;
        ">
            <header style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.5rem;
                border-bottom: 1px solid #e0e0e0;
                background: white;
            ">
                <h2 style="
                    font-size: 1.25rem;
                    font-weight: 500;
                    margin: 0;
                    color: #1f2937;
                    flex: 1;
                " id="enderecoModalTitle">Complete seu endereço</h2>
                <button onclick="closeEnderecoModal()" style="
                    background: none;
                    border: none;
                    font-size: 1.5rem;
                    color: #666;
                    cursor: pointer;
                    padding: 0.5rem;
                    border-radius: 50%;
                    width: 2rem;
                    height: 2rem;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                    margin-left: auto;
                " aria-label="Fechar modal">×</button>
            </header>

            <div style="
                flex: 1;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding: 1.5rem;
                box-sizing: border-box;
            ">
                <form id="enderecoForm" style="
                    display: grid;
                    gap: 1rem;
                    width: 100%;
                    max-width: 100%;
                    box-sizing: border-box;
                ">
                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="logradouro">Logradouro *</label>
                        <input type="text" id="logradouro" placeholder="Ex: Rua das Flores, Avenida Brasil" required style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            transition: border-color 0.2s ease;
                        ">
                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="numero">Número *</label>
                        <input type="text" id="numero" placeholder="Ex: 123, S/N" required style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            transition: border-color 0.2s ease;
                        ">
                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="complemento">Complemento</label>
                        <input type="text" id="complemento" placeholder="Ex: Apto 45, Bloco B, Casa 2" style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            transition: border-color 0.2s ease;
                        ">
                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="bairro">Bairro *</label>
                        <input type="text" id="bairro" placeholder="Ex: Centro, Jardim das Flores" required style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            transition: border-color 0.2s ease;
                        ">
                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="cep">CEP *</label>
                        <input type="text" id="cep" placeholder="Ex: 01234-567" maxlength="9" required style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            transition: border-color 0.2s ease;
                        ">
                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="cidade">Cidade/Localidade *</label>
                        <input type="text" id="cidade" placeholder="Ex: São Paulo, Rio de Janeiro" required style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            transition: border-color 0.2s ease;
                        ">
                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.5rem;
                        width: 100%;
                        min-width: 0;
                    ">
                        <label style="
                            font-size: 0.875rem;
                            font-weight: 500;
                            color: #333;
                        " for="estado">Estado/UF *</label>
                        <select id="estado" required style="
                            padding: 0.75rem;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            font-size: 1rem;
                            font-family: inherit;
                            width: 100%;
                            box-sizing: border-box;
                            max-width: 100%;
                            min-width: 0;
                            background: white;
                            transition: border-color 0.2s ease;
                        ">
                            <option value="">Selecione o estado</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>


                </form>
            </div>

            <footer style="
                padding: 1.5rem;
                border-top: 1px solid #e0e0e0;
            ">
                <button type="submit" form="enderecoForm" id="btnSalvarEndereco" style="
                    background: #1a73e8;
                    color: white;
                    border: none;
                    padding: 0.75rem 1rem;
                    border-radius: 8px;
                    font-size: 1rem;
                    font-weight: 500;
                    cursor: pointer;
                    width: 100%;
                    transition: background-color 0.2s ease;
                ">Salvar Endereço</button>
            </footer>
        </div>
    </div>

    <style>
    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    </style>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-navigation">
  <a href="pedidos.html" class="nav-item" id="btnServicos">
    <img src="./imgs/pedidoicon.png" alt="Serviços" class="nav-icon">
    <span class="nav-label">Serviços</span>
  </a>
  <a href="home.html" class="nav-item" id="btnHome">
    <img src="./imgs/mapaicon.png" alt="Home" class="nav-icon">
    <span class="nav-label">Home</span>
  </a>
  <a href="mensagens.html" class="nav-item" id="btnMensagens">
    <img src="./imgs/chaticon.png" alt="Mensagens" class="nav-icon">
    <span class="nav-label">Mensagens</span>
  </a>
  <a href="perfil.html" class="nav-item active" id="btnPerfil">
    <img src="./imgs/perfilicon.png" alt="Perfil" class="nav-icon">
    <span class="nav-label">Perfil</span>
  </a>
</nav>

</html>
